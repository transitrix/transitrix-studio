# Transitrix Studio — publish manifest
#
# This file declares what is published from this repository and consumed by
# its audience. A pull request adding or modifying a file not listed here
# fails the publish gate — deny by default.
#
# Files not listed are internal-only and remain in the repository without
# being served to consumers.

published:
  # VS Code extension — published to VS Code Marketplace and Open VSX
  - extension/**

  # IntelliJ/IDEA plugin — published to JetBrains Marketplace
  - intellij/**

  # npm packages — published to npm registry
  - packages/cli/**
  - packages/diagrams/**

  # Reusable read-only viewer source, build entry, runtime adapter and usage examples
  - packages/viewer/**

  # Repository front page and documentation
  - README.md
  - CHANGELOG.md
  - changelog/fragments/jetbrains-svg-canvas.md
  - changelog/fragments/goals-title-spacing.md
  - changelog/fragments/action-completion-percent.md
  - CONTRIBUTING.md
  - LICENSE
  - NOTICE

  # Published deliverable schemas (generated, committed)
  - schemas/**

  # Regression coverage for the published completion reader
  - tests/action-progress-reader.test.ts

  # Regression coverage for packaged report webview verification
  - tests/report-dom-probe.test.ts

  - publish-manifest.yaml
  - scripts/check-publish-manifest.mjs

  # Repository validator shipped in the CLI, its regression tests, and release note
  - src/repo-validate.ts
  - src/methodology-version.ts
  - tests/diagnostic-contract.test.ts
  - changelog/fragments/diagnostic-contract.md
  - tests/repo-validate-views.test.ts
  - tests/repo-validation-coverage.test.ts
  - changelog/fragments/repository-notation-coverage.md
  - docs/validation.md
  - changelog/fragments/whole-zone-enumeration.md

  # npm publishing requires channel selection and its fail-closed regression check
  - scripts/npm-publish-tag.mjs
  - scripts/npm-publish-tag.test.mjs

  # Release-package listing guard and its positive/negative regression cases
  - scripts/verify-extension-packaging.test.mjs

  # Read-only document checker shipped in CLI/editor and its consumer contract
  - src/document-provenance.ts
  - docs/document-provenance.md
  - vendor/methodology/document-renderer/provenance/VENDORED.json
  - vendor/methodology/document-renderer/provenance/provenance.mjs
  - vendor/methodology/document-renderer/provenance/provenance.d.mts
  - vendor/methodology/document-renderer/provenance/provenance-result.schema.json
  - vendor/methodology/document-renderer/provenance/parse-recipe.mjs
  - vendor/methodology/document-renderer/provenance/ids.mjs
  - vendor/methodology/document-renderer/provenance/syntax.mjs

  # CI regression test for the dependency merge workflow
  - .github/tests/test_dependabot_merge.py
