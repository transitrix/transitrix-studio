name: Attach universal VSIX to release draft

# Builds the universal VSIX once (build-vsix.yml) and attaches it, with its
# recorded SHA-256, to an existing release draft before it is published.
# Every registry-publish job downstream downloads this exact file instead of
# repackaging, so the artefact verified before release is the one that ships.
#
# Draft release activity does not emit a dependable Actions event. Run this
# workflow explicitly against the release commit after creating the draft.
# The attach job refuses a non-draft release or a draft aimed at any other
# commit.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (for example v3.3.1)
        required: true
        type: string
  # A dispatch-only reusable caller is parsed on every push and fails with
  # zero jobs. This branch name is not used; real work stays dispatch-only.
  push:
    branches:
      - '__never_match_attach_release__'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-vsix.yml

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download universal VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: output

      - name: Verify downloaded artifact matches the attested hash
        shell: bash
        run: |
          vsix=$(ls output/*.vsix | head -n 1)
          expected="${{ needs.build.outputs.sha256 }}"
          actual=$(sha256sum "$vsix" | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::downloaded artifact does not match the build job's recorded SHA-256"
            exit 1
          fi

      - name: Resolve and verify the target release draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be a stable semver tag such as v3.3.1"
            exit 1
          fi

          # GitHub's tag endpoint returns 404 for drafts because their tags do
          # not exist until publication. Resolve the unique draft from the
          # release collection instead.
          release=$(
            gh api --paginate "/repos/${{ github.repository }}/releases" |
              jq -s --arg tag "$RELEASE_TAG" '
                [.[][] | select(.draft == true and .tag_name == $tag)] |
                if length == 1 then .[0]
                elif length == 0 then error("no unpublished draft has that tag")
                else error("multiple unpublished drafts have that tag")
                end
              '
          )
          draft=$(jq -r '.draft' <<<"$release")
          target=$(jq -r '.target_commitish' <<<"$release")
          release_id=$(jq -r '.id' <<<"$release")

          if [ "$draft" != "true" ]; then
            echo "::error::$RELEASE_TAG is not an unpublished draft"
            exit 1
          fi
          if [ "$target" != "${{ github.sha }}" ]; then
            echo "::error::draft target $target does not match workflow commit ${{ github.sha }}"
            exit 1
          fi

          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Verified draft $RELEASE_TAG targets $target"

      - name: Verify SBOM hash
        shell: bash
        run: |
          sbom=$(ls output/sbom.xml | head -n 1)
          expected=$(cat output/sbom.sha256 | cut -d' ' -f1)
          actual=$(sha256sum "$sbom" | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::SBOM hash verification failed"
            exit 1
          fi

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Release assets upload through uploads.github.com, not the api.github.com
          # host `gh api` defaults to for a bare path — `gh release upload` targets
          # the correct host itself.
          gh release upload "${{ inputs.tag }}" \
            output/*.vsix output/*.sha256 output/sbom.xml output/sbom.sha256 \
            -R ${{ github.repository }}

      - name: Update release notes with attestation verification command
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          vsix_name="transitrix-studio-${tag#v}.vsix"

          # Get the current release notes
          release=$(gh api "/repos/${{ github.repository }}/releases/tags/$tag")
          current_body=$(echo "$release" | jq -r '.body')

          # Add attestation verification section if not already present
          if ! echo "$current_body" | grep -q "gh attestation verify"; then
            new_body="$current_body

## Verify build provenance

To verify that this release was built by our CI pipeline and has not been tampered with:

\`\`\`bash
gh attestation verify --owner transitrix $vsix_name
\`\`\`

## Bill of Materials

This release includes a Software Bill of Materials (SBOM) in CycloneDX format listing all components and dependencies. Download \`sbom.xml\` to audit the release contents."

            gh api -X PATCH "/repos/${{ github.repository }}/releases/tags/$tag" \
              -f body="$new_body"
          fi
