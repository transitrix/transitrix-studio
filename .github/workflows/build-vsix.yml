name: Build universal VSIX (attested)

# One CI job produces the universal VSIX from pinned inputs, records its
# SHA-256, attests it with actions/attest-build-provenance (no external
# service, no key), and exposes it as a build artifact a later job can
# download. This is the artefact every later consumer — verification, then
# registry publish — uses instead of rebuilding, so the artefact that gets
# verified is the one that ships.
#
# Packaging here is not publishing: no registry credentials are in scope,
# and nothing leaves this workflow run. The standing rule that reserves
# `vsce package` to Valerii's explicit request covers a command run by hand
# on a workstation, not a credential-less CI job.
#
# Reusable via `workflow_call` — a verification workflow or a publish
# workflow adds a job with `uses: ./.github/workflows/build-vsix.yml`, then
# a dependent job downloads the `universal-vsix` artifact this produces.
# Callers must grant at least the permissions this workflow declares below.
# `workflow_dispatch` is also available for a standalone run.

on:
  workflow_call:
    inputs:
      release-tag:
        description: Optional release tag for deterministic timestamp (SOURCE_DATE_EPOCH)
        required: false
        type: string
    outputs:
      sha256:
        description: SHA-256 of the packaged .vsix
        value: ${{ jobs.build.outputs.sha256 }}
      artifact-name:
        description: Name of the uploaded build artifact containing the .vsix and its .sha256 file
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      release-tag:
        description: Optional release tag for deterministic timestamp (SOURCE_DATE_EPOCH)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Package, hash, attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      artifact-name: ${{ steps.hash.outputs.artifact-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Determine SOURCE_DATE_EPOCH
        id: epoch
        shell: bash
        run: |
          if [ -n "${{ inputs.release-tag }}" ]; then
            # Extract the commit timestamp from the tag for deterministic builds
            timestamp=$(git log -1 --format='%aI' "${{ inputs.release-tag }}" 2>/dev/null || echo '')
            if [ -z "$timestamp" ]; then
              # Fall back to current commit if tag doesn't exist (pre-release build)
              timestamp=$(git log -1 --format='%aI' HEAD)
            fi
            # Convert ISO 8601 to Unix timestamp
            epoch=$(date -d "$timestamp" +%s 2>/dev/null || date -jf "%FT%T%z" "$timestamp" +%s 2>/dev/null)
          else
            # Use current commit timestamp for non-release builds
            timestamp=$(git log -1 --format='%aI' HEAD)
            epoch=$(date -d "$timestamp" +%s 2>/dev/null || date -jf "%FT%T%z" "$timestamp" +%s 2>/dev/null)
          fi
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "Using SOURCE_DATE_EPOCH=$epoch for deterministic build"

      - name: Package universal VSIX
        # extension:prep + verify-extension-packaging + `vsce package` (no
        # --target: the extension ships no native/platform component, so one
        # VSIX installs everywhere) -> output/*.vsix
        #
        # SOURCE_DATE_EPOCH ensures deterministic zip timestamps: rebuilding
        # the same tag on any machine produces identical archive bytes.
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: npm run package-extension

      - name: Generate Software Bill of Materials
        shell: bash
        run: |
          vsix=$(ls output/*.vsix | head -n 1)
          node scripts/generate-sbom.mjs "$vsix"

      - name: Record SHA-256
        id: hash
        shell: bash
        run: |
          vsix=$(ls output/*.vsix | head -n 1)
          sbom=$(ls output/sbom.xml | head -n 1)
          sha=$(sha256sum "$vsix" | cut -d' ' -f1)
          sbom_sha=$(sha256sum "$sbom" | cut -d' ' -f1)
          echo "$sha  $(basename "$vsix")" > "$vsix.sha256"
          echo "$sbom_sha  $(basename "$sbom")" > "$sbom.sha256"
          echo "Packaged $vsix"
          echo "SHA-256: $sha"
          echo "SBOM: $sbom"
          echo "SBOM SHA-256: $sbom_sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact-name=universal-vsix" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: output/*.vsix

      # Retention only has to outlast the run that consumes this. Every caller
      # downloads the artifact in a job of the same run, and the copy that ships
      # is attached to the release by `attach-release-vsix`, where it lives as a
      # release asset outside Actions storage. Seven days leaves room to fetch a
      # standalone dispatch by hand; holding longer accumulates one ~3 MB copy
      # per run of a workflow that runs on every release path.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-vsix
          path: |
            output/*.vsix
            output/*.sha256
            output/sbom.xml
          if-no-files-found: error
          retention-days: 7
