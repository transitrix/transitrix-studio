name: Dependabot auto-merge

# Weekly Dependabot updates auto-merge on green, gated by this repository's own
# CI — including Public-surface hygiene and the PR-description policy, since
# this repo is public. `dependabot.yml` already excludes major-version bumps;
# the metadata check below is a second, independent gate on the same property.
#
# This repo has no branch-protection rule, so GitHub's native `gh pr merge
# --auto` would have nothing to wait on and would merge immediately. Waiting
# on other PR checks explicitly instead keeps the gate self-contained without
# touching repo-wide branch-protection settings.
#
# Important: do NOT use `gh pr checks --watch` unfiltered — it waits on this
# job's own `auto-merge` check and deadlocks forever.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge-guard-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tests/test_dependabot_merge.py

  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Wait for checks, then merge on green
        if: contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || exit 1
          assert_head() {
            gh pr view "$PR_URL" --json headRefOid,state,isDraft | jq -e \
              --arg head "$EXPECTED_HEAD" \
              '.headRefOid == $head and .state == "OPEN" and .isDraft == false' >/dev/null
          }

          # Require the always-triggered checks, even before GitHub has queued
          # every workflow. A nonempty list containing only this job is not CI.
          required='["Diff + PR-metadata blocklist", "PR description policy", "Build & Test with Metrics Regression", "merge-guard-tests"]'
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"
          query='query($owner:String!,$repo:String!,$sha:GitObjectID!){repository(owner:$owner,name:$repo){object(oid:$sha){... on Commit{statusCheckRollup{contexts(first:100){totalCount nodes{__typename ... on CheckRun{name status conclusion checkSuite{app{slug}}} ... on StatusContext{context state}}}}}}}}'
          deadline=$((SECONDS + 3600))
          while (( SECONDS < deadline )); do
            assert_head
            # Use one rollup snapshot so CheckRun producer data and legacy
            # StatusContext results are classified at the same point in time.
            json="$(gh api graphql -f query="$query" -F owner="$owner" -F repo="$repo" -F sha="$EXPECTED_HEAD")"
            printf '%s' "$json" | jq -e '
              .data.repository.object.statusCheckRollup.contexts as $contexts |
              ($contexts.totalCount | type == "number") and
              ($contexts.nodes | type == "array") and
              $contexts.totalCount == ($contexts.nodes | length) and
              all($contexts.nodes[];
                if .__typename == "CheckRun" then
                  (.name | type == "string") and
                  (.status | type == "string") and
                  (.conclusion == null or (.conclusion | type == "string")) and
                  (.checkSuite.app.slug | type == "string")
                elif .__typename == "StatusContext" then
                  (.context | type == "string") and (.state | type == "string")
                else false end)' >/dev/null
            other="$(printf '%s' "$json" | jq '[
              .data.repository.object.statusCheckRollup.contexts.nodes[] |
              select(.__typename != "CheckRun" or .name != "auto-merge")]')"
            # GitHub Advanced Security emits a neutral aggregate CodeQL check
            # when its default-setup analyses are absent from a Dependabot head.
            # Exclude only that concrete producer/name/result tuple. An
            # identically named run from any other app still fails closed.
            gate="$(printf '%s' "$other" | jq '[.[] | select(
              .name != "CodeQL" or
              .status != "COMPLETED" or
              .conclusion != "NEUTRAL" or
              .checkSuite.app.slug != "github-advanced-security")]')"

            # Only explicit passes qualify. Skipped, cancelled, failed and
            # unknown results cannot stand in for successful execution. The
            # single advisory CodeQL aggregate above is not execution evidence.
            if printf '%s' "$gate" | jq -e 'any(.[];
              if .__typename == "CheckRun" then
                (.status != "REQUESTED" and .status != "WAITING" and .status != "QUEUED" and
                 .status != "IN_PROGRESS" and .status != "PENDING" and .status != "COMPLETED") or
                (.status == "COMPLETED" and .conclusion != "SUCCESS")
              elif .__typename == "StatusContext" then
                .state != "EXPECTED" and .state != "PENDING" and .state != "SUCCESS"
              else true end)' >/dev/null; then
              echo "A non-self check did not pass; refusing merge."
              exit 1
            fi
            if printf '%s' "$gate" | jq -e --argjson required "$required" '
              . as $checks | length > 0 and
              all(.[];
                if .__typename == "CheckRun" then .status == "COMPLETED" and .conclusion == "SUCCESS"
                elif .__typename == "StatusContext" then .state == "SUCCESS"
                else false end) and
              all($required[]; . as $name | any($checks[];
                .__typename == "CheckRun" and .name == $name and
                .status == "COMPLETED" and .conclusion == "SUCCESS"))' >/dev/null; then
              # Detect pushes during polling, then let the merge API enforce
              # this same SHA atomically if a push races the final read.
              assert_head
              gh pr merge --squash --delete-branch --match-head-commit "$EXPECTED_HEAD" "$PR_URL"
              exit 0
            fi
            echo "Waiting for all required checks to pass…"
            sleep 15
          done
          echo "Timed out waiting for checks after 1h"
          exit 1
