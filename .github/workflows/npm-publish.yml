name: npm — publish packages

# Triggered on every GitHub Release to publish the npm packages:
#   @transitrix/diagrams  (packages/diagrams — built via its workspace build)
#   @transitrix/cli       (packages/cli — assembled by its prepack script)
#
# Each publish step is idempotent: it compares the workspace version with the
# registry and skips when that version is already published, so releases that
# bump only one package (or neither) stay green.
#
# Prerequisites (one-time maintainer setup):
#   Configure a GitHub Actions trusted publisher on EACH npm package:
#   organization/user: transitrix; repository: transitrix-studio;
#   workflow filename: npm-publish.yml; environment: leave empty.
#   See https://docs.npmjs.com/trusted-publishers/
#
# Package versions come from each workspace's package.json and are versioned
# independently from the VS Code extension. Bump them in the release PR when
# the corresponding sources changed — the version-guards job below gates the
# publish on those bumps actually covering what the release contains.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag whose verified assets will be published
        required: true
        type: string

permissions:
  contents: read

jobs:
  version-guards:
    name: package versions cover this release
    runs-on: ubuntu-latest

    steps:
      # Full history + tags: the guard compares this release against the
      # previous release tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check npm channel selection
        run: node --test scripts/npm-publish-tag.test.mjs

      - name: Test exact package refusal controls
        run: node --test scripts/verify-release-packages.test.mjs

      - name: Check release package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/check-release-versions.mjs

  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: version-guards
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1 (Node >= 22.14.0).
      - name: Install OIDC-capable npm
        run: npm install --global npm@11

      - name: Download the release-qualified package archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          node -e "const r=require('./release.json'); if(r.draft || r.target_commitish !== process.env.GITHUB_SHA) process.exit(1)"
          mkdir qualified
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --dir qualified \
            --pattern '*.tgz' --pattern '*.vsix' --pattern 'cli-qualification.json' --pattern 'runtime-audit.json' --pattern 'SHA256SUMS'
      - name: Verify exact qualified package identities
        run: node scripts/verify-release-packages.mjs qualified qualified/*.vsix

      # These are the exact qualified archives. Never rebuild at publication.
      - name: Publish verified archives (skip only identical registry bytes)
        run: |
          set -euo pipefail
          for package in diagrams cli; do
            version=$(node -p "require('./packages/$package/package.json').version")
            archive="qualified/transitrix-$package-$version.tgz"
            integrity=$(node -e "const fs=require('fs'),c=require('crypto');console.log('sha512-'+c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$archive")
            published=$(npm view "@transitrix/$package@$version" dist.integrity 2>/dev/null || true)
            if [ -n "$published" ]; then
              test "$published" = "$integrity" || { echo 'Existing package integrity differs'; exit 1; }
              echo "Identical @transitrix/$package@$version already published; skipping"
            else
              channel=$(node scripts/npm-publish-tag.mjs "$version")
              npm publish "$archive" --ignore-scripts --access public --tag "$channel"
            fi
          done
