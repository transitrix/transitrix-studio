name: Public-surface hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    name: Diff + PR-metadata blocklist
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Block internal agent-ops filenames
        run: |
          # organizations/** holds intentional demo-adopter fixture content (e.g. acme_corp's own
          # AGENTS.md, vendored for example purposes) -- legit, not the internal-ops leak this guards against.
          hits=$(git ls-files | grep -iE '(^|/)(CLAUDE|AGENTS)\.md$' | grep -v '^organizations/' || true)
          if [ -n "$hits" ]; then
            echo "::error::CLAUDE.md/AGENTS.md are not allowed in this public repo (internal agent-ops docs)"
            echo "$hits"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run hygiene check
        env:
          HYGIENE_BLOCKLIST: ${{ secrets.HYGIENE_BLOCKLIST }}
          HYGIENE_BLOCKLIST_HUB: ${{ secrets.HYGIENE_BLOCKLIST_HUB }}
          HYGIENE_HUB_SLUG: ${{ secrets.HYGIENE_HUB_SLUG }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/ci-hygiene-check.mjs

      - name: Test publish manifest checker
        run: node --test scripts/check-publish-manifest.test.mjs

      - name: Check publish manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/check-publish-manifest.mjs

      - name: Run full-tree hygiene check
        env:
          HYGIENE_HUB_SLUG: ${{ secrets.HYGIENE_HUB_SLUG }}
        run: node scripts/ci-hygiene-tree.mjs

      - name: Work-item references
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/ci-hygiene-hashrefs.mjs

      - name: Packaged image references
        run: node scripts/ci-hygiene-image-refs.mjs

      - name: Record scanned pull request subject
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          # Bind successful scans to the event metadata they actually checked.
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pull = event['pull_request']
          subject = {
              'schema': 'public-hygiene-subject/v1',
              'number': pull['number'],
              'head': pull['head']['sha'],
              'base': pull['base']['sha'],
              'title': pull['title'],
              'body': pull.get('body') or '',
          }
          encoded = json.dumps(subject, sort_keys=True, separators=(',', ':')).encode()
          print('HYGIENE_SUBJECT_SHA256=' + hashlib.sha256(encoded).hexdigest())
          PYTHON
