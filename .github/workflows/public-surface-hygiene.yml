name: Public-surface hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    name: Diff + PR-metadata blocklist
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Block internal agent-ops filenames
        run: |
          # organizations/** and root AGENTS.md are allowed:
          # - organizations/: demo-adopter fixture content (e.g. acme_corp's own AGENTS.md, vendored for example)
          # - root AGENTS.md: public agent entrypoint per epic #550 (transitrix-hq)
          # Internal CLAUDE.md is never public; AGENTS.md elsewhere is internal-only.
          hits=$(git ls-files | grep -iE '(^|/)(CLAUDE)\.md$' || true)
          # AGENTS.md block: allow root-level only (public entrypoint), block elsewhere
          claude_hits=$(echo "$hits" | grep -v '^organizations/' || true)
          agents_hits=$(git ls-files | grep -iE '(^|/)(AGENTS)\.md$' | grep -v '^AGENTS\.md$' | grep -v '^organizations/' || true)

          if [ -n "$claude_hits" ] || [ -n "$agents_hits" ]; then
            echo "::error::CLAUDE.md and nested AGENTS.md are not allowed in this public repo (internal agent-ops)"
            [ -n "$claude_hits" ] && echo "CLAUDE.md:" && echo "$claude_hits"
            [ -n "$agents_hits" ] && echo "nested AGENTS.md:" && echo "$agents_hits"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run hygiene check
        env:
          HYGIENE_BLOCKLIST: ${{ secrets.HYGIENE_BLOCKLIST }}
          HYGIENE_BLOCKLIST_HUB: ${{ secrets.HYGIENE_BLOCKLIST_HUB }}
          HYGIENE_HUB_SLUG: ${{ secrets.HYGIENE_HUB_SLUG }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/ci-hygiene-check.mjs

      - name: Check publish manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/check-publish-manifest.mjs

      - name: Run full-tree hygiene check
        env:
          HYGIENE_HUB_SLUG: ${{ secrets.HYGIENE_HUB_SLUG }}
        run: node scripts/ci-hygiene-tree.mjs

      - name: Work-item references
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/ci-hygiene-hashrefs.mjs

      - name: Packaged image references
        run: node scripts/ci-hygiene-image-refs.mjs
